# nginx in front of the shop's Django/gunicorn service.
#
# Install as /etc/nginx/sites-available/duka-pos, link it into sites-enabled, then
# get the certificate:  sudo certbot --nginx -d pos.example.co.ke
# Replace every pos.example.co.ke with the address the shop actually owns.
#
# Why nginx takes the requests at all: it serves the built app and the product
# photos straight off disk, holds TLS, and keeps one slow customer from occupying
# the single gunicorn process the SQLite books allow.

upstream duka_pos {
    server 127.0.0.1:8000 fail_timeout=5s;
    keepalive 16;
}

# A till on a shop connection shares one public address, so the limit is per
# server, not per person. The API is throttled by the app itself (login 10/min,
# checkout 300/min, STK prompts 5/min); this zone only keeps junk traffic off it.
limit_req_zone $binary_remote_addr zone=duka_api:10m rate=25r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pos.example.co.ke;

    # certbot answers the ACME challenge here before the redirect exists.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pos.example.co.ke;

    # HTTP/2 makes the first load of the till noticeably quicker. The directive
    # moved between versions, so use the one your nginx knows and delete the other:
    #   nginx 1.25 and newer:  http2 on;
    #   nginx 1.24 and older:  add ` http2` to the end of the listen line above.
    # http2 on;

    ssl_certificate     /etc/letsencrypt/live/pos.example.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A product photo is a phone camera file. The default 1m gives "413" on the
    # very first upload the shop tries.
    client_max_body_size 8m;

    root /srv/duka-pos/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /sw.js {
        # A cached service worker is how a till keeps running an old screen after
        # an update. It must be re-checked every time it is opened.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        alias /srv/duka-pos/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/duka-pos/backend/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Product photos only. Anything else in that folder is the shop's own data.
        location ~* \.(php|pl|py|sh|cgi)$ { deny all; }
    }

    location /api/ {
        limit_req zone=duka_api burst=50 nodelay;
        proxy_pass http://duka_pos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # settings.py trusts this header to know the shop is on HTTPS. Without it
        # the admin thinks it is on plain http and the Secure cookies are dropped.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Safaricom posts payment confirmations here, and retries from addresses that
    # change between attempts. A 429 or a slow 504 is a customer who has paid and
    # a bill that still reads "waiting for M-Pesa" - so no rate limit on this one
    # route, and a longer wait for the app's answer.
    location = /api/mpesa/callback/ {
        proxy_pass http://duka_pos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        access_log /var/log/nginx/duka-mpesa-callback.log;
    }

    location /admin/ {
        proxy_pass http://duka_pos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        # The React app owns every address that is not a file, so a refresh on
        # /transactions still answers.
        try_files $uri $uri/ /index.html;
    }
}
